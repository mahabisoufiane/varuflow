name: Backend Tests

on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Python Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     varuflow
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB:       varuflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest --tb=short -q
        env:
          DATABASE_URL:        postgresql+asyncpg://varuflow:testpassword@localhost:5432/varuflow_test
          ENV:                 test
          SUPABASE_URL:        https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder_service_key
          SUPABASE_JWT_SECRET: test_jwt_secret_32_chars_minimum_x
          AUTH_JWT_SECRET:     test_auth_secret_32_chars_minimum_x
          PORTAL_JWT_SECRET:   test_portal_secret_32_chars_min_xx
          RESEND_API_KEY:      re_test_placeholder
          STRIPE_SECRET_KEY:   sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
          OPENAI_API_KEY:      sk_test_openai_placeholder
          PII_ENCRYPTION_KEY:  dGVzdF9lbmNyeXB0aW9uX2tleV8zMmNoYQ==
          FORTNOX_ENCRYPTION_KEY: dGVzdF9mb3J0bm94X2tleV8zMmNoYXJzXw==
          ADMIN_API_KEY:       test_admin_key
          FRONTEND_URL:        http://localhost:3000
          PORTAL_BASE_URL:     http://localhost:3000
          CORS_ORIGINS:        http://localhost:3000
          ENFORCE_SECRET_VALIDATION: "false"
          ENFORCE_JWT_SIGNATURE: "false"

      - name: Ruff lint check
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

      - name: Type check with mypy (non-blocking — M3, ~599 pre-existing errors being driven down)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install mypy
          mypy app
