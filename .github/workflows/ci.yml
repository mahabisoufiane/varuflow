name: CI

# Repo layout note: the application lives in varuflow-main/ (the git root
# also holds varuflow-pos/). Workflows MUST live here at the repo root —
# they sat in varuflow-main/.github/ until 2026-07-08 and never ran.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: varuflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/varuflow_test
      SUPABASE_JWT_SECRET: test-secret-at-least-32-characters-long
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""

    defaults:
      run:
        working-directory: varuflow-main/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with Ruff (non-blocking — 16,403 pre-existing errors as of
              2026-07-08; this gate never ran while workflows sat in the wrong
              directory. Drive the count down, then remove continue-on-error.)
        run: poetry run ruff check app
        continue-on-error: true

      - name: Type check with mypy (non-blocking — M3, ~599 pre-existing errors being driven down)
        run: poetry run mypy app
        continue-on-error: true

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Tenant isolation (security gate)
        run: poetry run pytest tests/test_tenant_isolation.py -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/varuflow_test
          ENV: development
          ALLOW_DEV_BYPASS: "true"

      - name: Run tests
        run: poetry run pytest --tb=short -q

  frontend:
    name: Frontend — gates + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: varuflow-main/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        # Next.js 16 requires Node >= 20.9; production Vercel runs 24.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: varuflow-main/frontend/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps: ESLint peer conflict with Next 16 (see CLAUDE.md)
        run: npm ci --legacy-peer-deps

      - name: Design-token ratchet
        # `next lint` is broken under Next 16; these scripts + tsc are the
        # real lint gates this project uses (see frontend/scripts/).
        run: bash scripts/check-tokens.sh

      - name: Silent-swallow ratchet
        run: bash scripts/check-silent-swallow.sh

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  locales:
    name: Locales — key parity vs en.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: varuflow-main
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify every locale matches en.json key-for-key
        run: python3 scripts/check_locales.py
