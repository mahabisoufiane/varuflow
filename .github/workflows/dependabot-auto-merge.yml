name: Dependabot auto-merge

# ---------------------------------------------------------------------------
# Item 27 — patch-only auto-merge for Dependabot.
#
# Why a dedicated workflow?
#   Dependabot alone cannot merge PRs. Auto-merge is a separate GitHub
#   feature ("Enable auto-merge") that must be requested per-PR. This
#   workflow requests it on Dependabot patch-version PRs only, gated on
#   CI being green — the usual branch-protection rules still apply, so
#   `gh pr merge --auto` will queue the merge until every required check
#   (pip-audit, npm audit, tests, lints) passes.
#
# Why patch-only?
#   A patch bump (1.2.3 → 1.2.4) is a conservative fix release by SemVer
#   definition — no API changes, no behaviour changes, no new features.
#   Almost every library treats it as a bugfix-only channel. Auto-merging
#   these frees the reviewer queue for minor/major bumps that actually
#   need eyes. Security-update PRs are ALSO auto-merged (Dependabot routes
#   those into the `*-security` groups) because the whole point is to
#   patch a CVE as fast as CI allows.
#
# Why not minor/major?
#   Minor releases occasionally ship opt-in behaviour or new transitive
#   deps that surprise consumers. Major releases are breaking by
#   definition. Both go through human review.
# ---------------------------------------------------------------------------

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only consider Dependabot-authored PRs. A human PR that happens to
    # change package.json should never be auto-merged by this workflow.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and security updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.dependency-type == 'direct:production' &&
          steps.meta.outputs.update-type == 'version-update:semver-security' ||
          steps.meta.outputs.update-type == 'version-update:semver-security'
        # `--auto` queues the merge behind required status checks; if any
        # check fails, the merge is NOT performed and the PR stays open
        # for human review. We merge via squash to keep `main` history
        # linear and Dependabot's commit messages out of the log.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
